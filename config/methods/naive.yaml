index:
  paths:
    bm25_index_path: "indexes/storage/BM25Model_hotpot_hippo_c1200"

inference:
  naive:
    return_top_k: 5

roles:
  retriever:
    BM25Model:
      top_k: 5
  rewriter:
    OpenAIGenerator:
      method: "hyde"
      num_hypotheses: 4
      max_tokens: 512
      temperature: 0.7
      task: "web_search"
      language: "en"
  reasoner:
    OpenAIGenerator:
      prompt_name: "naive_rag"
      max_tokens: 256
      temperature: 0.0

evaluation:
  data_file: "data/evalute/hotpot_hippotest.jsonl"
  sample_num: 4
  random_sample: false
  metrics:
    - "em"
    - "f1"
    - "acc"
    - "recall@4"
